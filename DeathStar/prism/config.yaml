# config.yaml
# Shared configuration for Texas CZ Weather workflow

prism:
  # Local directory where PRISM BIL files are stored
  data_dir: "Z:/ek559/DeathStar/prism_raw"

  # Variables to extract
  variables:
    - ppt       # precipitation (mm)
    - tmax      # max daily temp (°C)
    - tmin      # min daily temp (°C)
    - tmean     # mean daily temp (°C)
    - tdmean    # mean dew point temp (°C)

  # Date range
  start_date: "2010-01-01"
  end_date:   "2026-03-17"

  # Resolution label used in folder names
  resolution: "25m"

# Geography vintages (§1 of PLAN_county_cz_panels.md) — fixed snapshots applied
# across the whole 2010-2026 window. Single source of truth for county_meta.csv
# and cz_meta.csv geo_vintage columns.
geo_vintage: "cb_2024"
cz_vintage:  "czone_2020"

commuting_zones:
  # Texas FIPS code
  state_fips: "48"

  # Where to save CZ shapefile
  shp_dir: "Z:/ek559/DeathStar/intermediate_data/cz_shapefiles"

  # CZ vintage used
  vintage: 2020

  # Local crosswalk file (county FIPS -> CZ)
  crosswalk: "Z:/ek559/DeathStar/raw_data/commuting-zones-2020.csv"

  # Local county shapefile directory
  county_shp: "Z:/ek559/DeathStar/raw_data/admin_boundaries/cb_2024_us_county_500k/cb_2024_us_county_500k.shp"

counties:
  # Texas FIPS code
  state_fips: "48"

  # Where to save county polygon file
  shp_dir: "Z:/ek559/DeathStar/intermediate_data/county_shapefiles"

  # Census cartographic boundary vintage used
  vintage: 2024

  # Local crosswalk file (county FIPS -> CZ), same source as commuting_zones
  crosswalk: "Z:/ek559/DeathStar/raw_data/commuting-zones-2020.csv"

  # Local county shapefile directory, same source as commuting_zones
  county_shp: "Z:/ek559/DeathStar/raw_data/admin_boundaries/cb_2024_us_county_500k/cb_2024_us_county_500k.shp"

output:
  # Intermediate per-year extraction CSVs
  extracted_dir: "Z:/ek559/DeathStar/intermediate_data/extracted"

  # Intermediate per-year county extraction CSVs
  extracted_county_dir: "Z:/ek559/DeathStar/intermediate_data/extracted_county"

  # Final CZ panel dataset (derived from county panel)
  panel_csv:     "Z:/ek559/DeathStar/clean_data/tx_cz_daily_weather.csv"
  panel_parquet: "Z:/ek559/DeathStar/clean_data/tx_cz_daily_weather.parquet"

  # Final county panel dataset
  county_panel_csv:     "Z:/ek559/DeathStar/clean_data/tx_county_daily_weather.csv"
  county_panel_parquet: "Z:/ek559/DeathStar/clean_data/tx_county_daily_weather.parquet"

  # Metadata / crosswalk files
  county_meta_csv: "Z:/ek559/DeathStar/clean_data/county_meta.csv"
  cz_meta_csv:     "Z:/ek559/DeathStar/clean_data/cz_meta.csv"

  # Coordinate reference system for spatial operations
  crs: "EPSG:4326"

# ============================================================
# ZCTA x day panel (PLAN_zcta_panel.md) — additive pipeline,
# does not touch any key above. PRISM 800m instead of 4km.
# ============================================================

prism800:
  base_url:   "https://services.nacse.org/prism/data/get/us/800m"
  clip_dir:   "Z:/ek559/DeathStar/prism_raw_800m_tx"
  variables:  [tmax, tmin, tmean, tdmean]
  start_date: "2010-01-01"
  end_date:   "2026-03-17"
  tx_bbox:    [-106.75, 25.75, -93.4, 36.6]   # xmin, ymin, xmax, ymax (EPSG:4269)
  request_sleep_sec: 2

zcta:
  shp_dir: "Z:/ek559/DeathStar/intermediate_data/zcta_shapefiles"
  eras:
    - {name: zcta510, start: "2010-01-01", end: "2019-12-31",
       url: "https://www2.census.gov/geo/tiger/GENZ2019/shp/cb_2019_us_zcta510_500k.zip",
       id_col: "ZCTA5CE10"}
    - {name: zcta520, start: "2020-01-01", end: "2026-03-17",
       url: "https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_zcta520_500k.zip",
       id_col: "ZCTA5CE20"}

output_zcta:
  extracted_zcta_dir:  "Z:/ek559/DeathStar/intermediate_data/extracted_zcta"
  zcta_panel_csv:      "Z:/ek559/DeathStar/clean_data/tx_zcta_daily_weather.csv"
  zcta_panel_parquet:  "Z:/ek559/DeathStar/clean_data/tx_zcta_daily_weather.parquet"
  zcta_meta_csv:       "Z:/ek559/DeathStar/clean_data/zcta_meta.csv"
